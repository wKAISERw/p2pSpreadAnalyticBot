<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />

    <!--
      Іконка вкладки — інлайновий SVG, а не файл: знак простий, і окремий
      запит за ним коштував би дорожче за самі байти. Тут стояло
      href="data:," — тобто порожньо, через що браузер малював глобус.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%2310b981%22%2F%3E%3Cpath%20d%3D%22M27%2016h-5l-3.5%209L12%207l-3%209H5%22%20fill%3D%22none%22%20stroke%3D%22%23020617%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%2310b981%22%2F%3E%3Cpath%20d%3D%22M27%2016h-5l-3.5%209L12%207l-3%209H5%22%20fill%3D%22none%22%20stroke%3D%22%23020617%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E" />

    <title>Arbix Quantum — P2P-сканер спредів зі скорингом мерчантів</title>
    <meta
      name="description"
      content="Сканер P2P-спредів на семи майданчиках із перевіркою контрагента: умови, поведінка, відгуки й чорні списки зводяться в один бал ризику."
    />

    <!-- Прев'ю для посилань у месенджерах -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Arbix Quantum — P2P-сканер спредів" />
    <meta
      property="og:description"
      content="Сім майданчиків, шість сигналів ризику, ліміти карток. Алерт приходить уже з вердиктом по контрагенту."
    />

    <!--
      Стилі завантажувача живуть тут, а не в бандлі, і це принципово.

      Раніше html/body не мали фону, а #root був порожній — тож від
      розбору HTML до монтування React браузер показував свій дефолтний
      БІЛИЙ екран. На повільному звʼязку, поки їде ~90 кБ джаваскрипту,
      це секунди сліпучого нічого. Саме це й побачив дизайнер.

      Тепер фон і індикатор малюються з першого кадру, ще до будь-якого
      JS. React рендерить у #root і природно затирає цей вміст.
    -->
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        background: #020617;
        color: #94a3b8;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font-family: 'JetBrains Mono', Consolas, ui-monospace, monospace;
        background: #020617;
      }

      /* Та сама сітка, що й на сторінках — щоб перехід був непомітним */
      #boot::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(148 163 184 / 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgb(148 163 184 / 0.07) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 70% 50% at 50% 50%, black, transparent);
      }

      .boot-mark {
        position: relative;
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: #10b981;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }

      .boot-mark svg {
        width: 42px;
        height: 42px;
      }

      .boot-label {
        position: relative;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #10b981;
      }

      .boot-status {
        position: relative;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: #475569;
      }

      /* Три крапки, що біжать — показують, що процес живий */
      .boot-status i {
        font-style: normal;
        animation: boot-blink 1.2s infinite;
      }
      .boot-status i:nth-child(2) { animation-delay: 0.2s; }
      .boot-status i:nth-child(3) { animation-delay: 0.4s; }

      /*
        Світло за курсором. Позиція пишеться в CSS-змінні напряму на
        елементі — ні стану, ні перемальовок; на дотикових пристроях
        слухач не вішається взагалі, бо курсора там немає.
      */
      #boot-glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 400ms ease;
        background: radial-gradient(
          22rem circle at var(--gx, 50%) var(--gy, 50%),
          rgb(16 185 129 / 0.16),
          transparent 65%
        );
      }

      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.65; transform: scale(0.94); }
      }

      @keyframes boot-blink {
        0%, 100% { opacity: 0.25; }
        50%      { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-status i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div id="boot-glow"></div>
        <span class="boot-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#020617" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
        </span>
        <span class="boot-label">arbix quantum</span>
        <span class="boot-status">
          Запуск сканера<i>.</i><i>.</i><i>.</i>
        </span>
      </div>
    </div>
    <script>
      // Виконується до завантаження бандла, тому все вручну й мінімально.
      (function () {
        var glow = document.getElementById('boot-glow');
        if (!glow || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

        window.addEventListener(
          'pointermove',
          function (e) {
            glow.style.opacity = '1';
            glow.style.setProperty('--gx', e.clientX + 'px');
            glow.style.setProperty('--gy', e.clientY + 'px');
          },
          { passive: true }
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
