services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbix_quantum_scanner
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Зберігаємо базу даних SQLite (WAL) на хост-машині
      - ./data:/app/data
      # Зберігаємо логи сканера на хост-машині
      - ./logs:/app/logs
    env_file:
      - .env
    networks:
      - arbix_net

networks:
  # Іменована явно, щоб дашборд (окремий compose-проєкт) міг підключитись
  # до неї як external і ходити на сканер по імені контейнера.
  arbix_net:
    name: arbix_net
